name: rupucontext

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Scan dup fixture with gate (expect fail)
        run: |
          set +e
          rupucontext scan fixtures/dup-pack.jsonl --fail-on-overlap -q -o /tmp/rupucontext-dup.json
          code=$?
          set -e
          test "$code" -eq 2

      - name: Scan clean fixture with gate (expect pass)
        run: rupucontext scan fixtures/clean-pack.jsonl --fail-on-overlap -q -o /tmp/rupucontext-clean.json
