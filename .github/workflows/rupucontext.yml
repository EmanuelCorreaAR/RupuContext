name: rupucontext

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Gate fixture (expect fail)
        run: |
          rupucontext gate fixtures/dup-pack.jsonl --threshold 0.85 -q -o /tmp/rupucontext-gate.json
          test $? -eq 2

      - name: Gate clean fixture (expect pass)
        run: rupucontext gate fixtures/clean-pack.jsonl --threshold 0.85 -q -o /tmp/rupucontext-clean.json
